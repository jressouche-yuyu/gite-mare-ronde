name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # rafraîchit les disponibilités Airbnb toutes les 6 h

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Installer les dépendances
        run: npm ci
      - name: Générer tina-lock.json (mode local, sans cloud)
        run: npm run tina:build -- --local --skip-cloud-checks || echo "génération lock KO"
      - name: Committer tina-lock.json (→ indexation TinaCloud)
        run: |
          echo "── recherche tina-lock.json ──"
          find . -name 'tina-lock.json' -not -path './node_modules/*' || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LOCK=$(find . -name 'tina-lock.json' -not -path './node_modules/*' | head -1)
          if [ -n "$LOCK" ]; then
            echo "lock trouvé: $LOCK"
            git add -f "$LOCK"
            git diff --staged --quiet || { git commit -m "chore: update tina-lock.json [skip ci]"; git push; }
          else
            echo "Aucun tina-lock.json généré — on continue."
          fi
      - name: Construire l'admin TinaCMS (cloud)
        run: npm run tina:build -- --skip-cloud-checks || echo "build admin cloud KO"
      - name: Build (Astro + base path)
        run: npm run build
      - name: Uploader l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
